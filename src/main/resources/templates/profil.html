<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon profil</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>🩸 Réseau Don de Sang</b><nav><a href="/dashboard">Tableau de bord</a> · <a href="/profil">Profil</a> · <a href="#" onclick="return logout()">Déconnexion</a></nav></header><main class="center"><section class="card form"><h1>Mon profil</h1><div id="data">Chargement…</div><form id="form"><label>Nom<input id="nom" name="nom"></label><label>Ville<input id="ville" name="ville"></label><label>Téléphone<input id="telephone" name="telephone"></label><label id="groupLabel">Groupe sanguin<input id="groupeSanguin" name="groupeSanguin"></label><label id="etabLabel">Nom établissement<input id="nomEtablissement" name="nomEtablissement"></label><label id="adresseLabel">Adresse<input id="adresse" name="adresse"></label><button class="btn">Enregistrer</button><p id="msg"></p></form></section></main><script>
async function load(){let r=await fetch('/api/profil');if(!r.ok){location='/login';return}let x=await r.json();document.querySelector('#nom').value=x.nom||'';document.querySelector('#ville').value=x.ville||'';document.querySelector('#telephone').value=x.telephone||'';document.querySelector('#groupeSanguin').value=x.groupeSanguin||'';document.querySelector('#nomEtablissement').value=x.nomEtablissement||'';document.querySelector('#adresse').value=x.adresse||'';document.querySelector('#data').innerHTML=`<p><b>Email :</b> ${x.email}</p><p><b>Rôle :</b> ${x.role}</p><p><b>Méthode :</b> ${x.methodeConnexion||''}</p><p><b>Création :</b> ${x.dateCreation||''}</p><p><b>Dernière connexion :</b> ${x.derniereConnexion||'Première connexion'}</p>`;let donor=!!x.groupeSanguin;document.querySelector('#etabLabel').style.display=donor?'none':'block';document.querySelector('#adresseLabel').style.display=donor?'none':'block';document.querySelector('#groupLabel').style.display=donor?'block':'none'}
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/profil',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});document.querySelector('#msg').textContent=r.ok?'Profil enregistré.':'Erreur lors de la mise à jour.'};async function logout(){if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return false;await fetch('/api/auth/deconnexion',{method:'POST'});location='/login?logout';return false}load();</script></body></html>
