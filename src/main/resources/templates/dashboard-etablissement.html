<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace établissement</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>🏥 Réseau Don de Sang</b><nav><a href="/dashboard">Dashboard</a> · <a href="/profil">Mon profil</a> · <a href="#" onclick="return logout()">Déconnexion</a></nav></header><main class="wrap"><h1 th:text="${user.nom}"></h1><div id="stats"></div><section class="card"><h2>Mettre à jour un stock</h2><form id="stockForm" class="inline-form"><select id="sg"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="qty" type="number" min="0" required placeholder="Nombre de poches"><button class="btn">Enregistrer</button></form><div id="stock"></div></section><section class="card"><h2>Publier une demande urgente</h2><form id="demForm" class="inline-form"><select id="dsg"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="qneed" type="number" min="1" required placeholder="Poches"><select id="urg"><option>ELEVEE</option><option>MOYENNE</option><option>FAIBLE</option></select><input id="desc" required placeholder="Description"><input id="lim" type="datetime-local" required><button class="btn">Publier</button></form><p id="demMsg"></p></section><section class="card"><h2>Rendez-vous</h2><div id="rdv"></div></section></main><script>
async function load(){let s=await(await fetch('/api/etablissement/tableau-de-bord')).json();stats.innerHTML=`<div class="grid"><div class="stat"><b>${s.demandesActives}</b><span>Demandes actives</span></div><div class="stat"><b>${s.rdvSemaine}</b><span>RDV semaine</span></div><div class="stat"><b>${s.donsMois}</b><span>Dons du mois</span></div></div>`;stock.innerHTML=s.stock.map(x=>`<article><b>${x.groupeSanguin}</b> — ${x.quantitePoches} poche(s)</article>`).join('');let r=await(await fetch('/api/etablissement/rendez-vous')).json();rdv.innerHTML=r.map(x=>`<article><b>${x.nomDonneur}</b> — ${x.dateRendezVous} — ${x.creneauHoraire} — ${x.statut} ${x.statut==='PLANIFIE'?`<button class="btn" onclick="confirmRdv(${x.id})">Confirmer</button>`:''}</article>`).join('')||'<p>Aucun rendez-vous.</p>'}stockForm.onsubmit=async e=>{e.preventDefault();await fetch('/api/etablissement/stock/'+sg.value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({quantitePoches:+qty.value})});load()};demForm.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/etablissement/demandes-urgentes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupeSanguinRecherche:dsg.value,quantiteNecessaire:+qneed.value,niveauUrgence:urg.value,description:desc.value,dateLimite:lim.value})});demMsg.textContent=r.ok?'Demande publiée.':'Échec de publication.';load()};async function confirmRdv(id){await fetch('/api/etablissement/rendez-vous/'+id+'/confirmer',{method:'PUT'});load()}async function logout(){if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return false;await fetch('/api/auth/deconnexion',{method:'POST'});location='/login?logout';return false}load();</script></body></html>
