<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace donneur</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>🩸 Réseau Don de Sang</b><nav><a href="/dashboard">Dashboard</a> · <a href="/profil">Mon profil</a> · <a href="#" onclick="return logout()">Déconnexion</a></nav></header><main class="wrap"><h1>Bonjour <span th:text="${user.nom}"></span></h1><div id="stats" class="grid"></div><section class="card"><h2>Prendre rendez-vous</h2><form id="rdv" class="inline-form"><select id="etab" required></select><input id="date" type="date" required><input id="creneau" placeholder="09h - 10h" required><select id="demande"><option value="">Sans demande spécifique</option></select><button class="btn">Réserver</button></form><p id="rdvMsg"></p></section><section class="card"><h2>Demandes urgentes correspondant à mon groupe</h2><div id="demandes"></div></section><section class="card"><h2>Historique des dons</h2><div id="dons"></div></section></main><script>
async function load(){let s=await(await fetch('/api/donneur/tableau-de-bord')).json();stats.innerHTML=`<div class="stat"><b>${s.totalDons}</b><span>Dons effectués</span></div><div class="stat"><b>${s.eligibilite}</b><span>Éligibilité</span></div><div class="stat"><b>${s.prochainDonPossible}</b><span>Prochain don</span></div><div class="stat"><b>${s.viesPotentiellementSauvees}</b><span>Vies estimées</span></div>`;let es=await(await fetch('/api/donneur/etablissements')).json();etab.innerHTML=es.map(x=>`<option value="${x.id}">${x.nomEtablissement} — ${x.ville||''}</option>`).join('');let ds=await(await fetch('/api/donneur/demandes-urgentes')).json();demande.innerHTML='<option value="">Sans demande spécifique</option>'+ds.map(x=>`<option value="${x.id}">${x.nomEtablissement} — ${x.groupeSanguinRecherche} — ${x.niveauUrgence}</option>`).join('');demandes.innerHTML=ds.map(x=>`<article><b>${x.nomEtablissement} • ${x.groupeSanguinRecherche} • ${x.niveauUrgence}</b><p>${x.description||''}</p><small>${x.quantiteNecessaire} poche(s), avant ${x.dateLimite}</small></article>`).join('')||'<p>Aucune demande active.</p>';let h=await(await fetch('/api/donneur/dons')).json();dons.innerHTML=h.map(x=>`<article>${x.dateDon} — ${x.quantiteMl} ml — ${x.groupeSanguin} — ${x.statutValidation}</article>`).join('')||'<p>Aucun don enregistré.</p>'}rdv.onsubmit=async e=>{e.preventDefault();let body={etablissementId:+etab.value,dateRendezVous:date.value,creneauHoraire:creneau.value,demandeId:demande.value?+demande.value:null};let r=await fetch('/api/donneur/rendez-vous',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});rdvMsg.textContent=r.ok?'Rendez-vous enregistré.':'Impossible de réserver.';};async function logout(){if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return false;await fetch('/api/auth/deconnexion',{method:'POST'});location='/login?logout';return false}load();</script></body></html>
