<!doctype html><html lang="fr" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Espace coordinateur</title><link rel="stylesheet" href="/css/app.css"></head><body><header><b>🛡 Réseau Don de Sang</b><nav><a href="/dashboard">Dashboard</a> · <a href="/profil">Profil</a> · <a href="#" onclick="return logout()">Déconnexion</a></nav></header><main class="wrap"><h1>Supervision du réseau</h1><div id="stats" class="grid"></div><section class="card"><h2>Répartition des donneurs</h2><div id="groups"></div></section><section class="card"><h2>Comptes</h2><div id="users"></div></section><section class="card"><h2>Alerte générale par groupe</h2><form id="alert" class="inline-form"><select id="group"><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select><input id="message" required placeholder="Message d'alerte"><button class="btn">Diffuser</button></form><p id="alertMsg"></p></section><section class="card"><h2>Demandes du réseau</h2><div id="requests"></div></section></main><script>
async function load(){let s=await(await fetch('/api/coordinateur/tableau-de-bord')).json();stats.innerHTML=Object.entries({Donneurs:s.totalDonneurs,'Établissements actifs':s.etablissementsActifs,'Dons réseau':s.donsReseau,'Demandes ouvertes':s.demandesOuvertes}).map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');groups.innerHTML=Object.entries(s.repartitionGroupes).map(([g,n])=>`<article><b>${g}</b> — ${n} donneur(s)</article>`).join('');let u=await(await fetch('/api/coordinateur/utilisateurs')).json();users.innerHTML=u.map(x=>`<article><b>${x.nom}</b> — ${x.email} — ${x.role} — ${x.compteActif?'ACTIF':'INACTIF'} ${x.compteActif&&x.role!=='COORDINATEUR'?`<button class="btn" onclick="desact(${x.id})">Désactiver</button>`:''}</article>`).join('');let q=await(await fetch('/api/coordinateur/demandes-urgentes')).json();requests.innerHTML=q.map(x=>`<article>${x.nomEtablissement} — ${x.groupeSanguinRecherche} — ${x.niveauUrgence} — ${x.statut}</article>`).join('')||'<p>Aucune demande.</p>'}async function desact(id){if(confirm('Désactiver ce compte ?')){await fetch('/api/coordinateur/utilisateurs/'+id+'/desactiver',{method:'PUT'});load()}}alert.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/coordinateur/alertes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({groupeSanguin:group.value,message:message.value})});alertMsg.textContent=r.ok?'Alerte diffusée.':'Échec.'};async function logout(){if(!confirm('Voulez-vous vraiment vous déconnecter ?'))return false;await fetch('/api/auth/deconnexion',{method:'POST'});location='/login?logout';return false}load();</script></body></html>
