<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activation</title><link rel="stylesheet" href="/css/app.css"></head>
<body><main class="center"><form class="card form" id="form"><h1>Activer le compte</h1><label>Email<input name="email" id="email" type="email" required></label><label>Code reçu par email<input name="code" maxlength="6" required></label><button class="btn">Vérifier</button><p id="msg"></p></form></main>
<script>document.querySelector('#email').value=new URLSearchParams(location.search).get('email')||'';document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/auth/verification-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let j=await r.json();document.querySelector('#msg').textContent=j.message;if(r.ok)setTimeout(()=>location.href='/login',700)}</script></body></html>
